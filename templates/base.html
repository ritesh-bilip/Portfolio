{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Ritesh Das — Python Backend & AI/ML Developer{% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

  <div class="site-noise"></div>
  <div class="ambient-grid"></div>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- ── NAV ── -->
  <nav>
    <a class="logo" href="{% url 'index' %}"><span>RK</span> Ritesh Das</a>
    <ul class="nav-links" id="navLinks">
      <li><a href="{% url 'index' %}">Home</a></li>
      <li><a href="{% url 'about' %}">About</a></li>
      <li><a href="{% url 'work' %}">Work</a></li>
      <li><a href="{% url 'service' %}">Stack</a></li>
      <li><a href="{% url 'contact' %}">Contact</a></li>
    </ul>
    <button class="hamburger" onclick="toggleMenu()" aria-label="Open navigation menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main class="page-wrap">
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'nav.js' %}"></script>
</body>

</html>
